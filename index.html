<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Label Sheets — choose your label type</title>
<style id="pageStyle">@page{ size:8.5in 11in; margin:0; }</style>
<style>
  :root{
    --desk:#20242b;
    --desk-2:#272c35;
    --panel:#2e343f;
    --panel-edge:#3a414e;
    --ink:#e8eaee;
    --ink-dim:#9aa3b2;
    --accent:#f5872e;
    --accent-ink:#1d1205;
    --warn:#ffd166;
    --paper-shadow: 0 14px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2c323d 0%, var(--desk) 60%),
      var(--desk);
    color:var(--ink);
    font:14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }

  /* ================= Toolbar ================= */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(var(--panel), var(--desk-2));
    border-bottom:1px solid var(--panel-edge);
    padding:10px 16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  #startSlot{
    width:56px; background:var(--desk); color:var(--ink);
    border:1px solid var(--panel-edge); border-radius:6px;
    padding:5px 6px; font:inherit; text-align:center;
  }
  button[disabled]{opacity:.4; cursor:default;}
  button[disabled]:hover{background:transparent;}
  .brand{display:flex; flex-direction:column; margin-right:8px; user-select:none;}
  .brand b{font-size:14px; letter-spacing:.06em; text-transform:uppercase;}
  .brand span{font-size:11px; color:var(--ink-dim); letter-spacing:.04em;}
  .group{
    display:flex; align-items:center; gap:4px;
    background:var(--desk-2);
    border:1px solid var(--panel-edge);
    border-radius:var(--radius);
    padding:4px;
  }
  button, select{
    appearance:none; background:transparent; color:var(--ink);
    border:1px solid transparent; border-radius:7px;
    padding:6px 10px; font:inherit; cursor:pointer; line-height:1;
  }
  button:hover{background:rgba(255,255,255,.07);}
  button:active{transform:translateY(1px);}
  button:focus-visible, select:focus-visible, .toggle input:focus-visible + .pill{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  button.is-on{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .b{font-weight:800;} .i{font-style:italic;} .u{text-decoration:underline;}
  select{background:var(--desk-2); border:1px solid var(--panel-edge); padding:6px 8px;}
  select option{background:var(--panel); color:var(--ink);}
  .spacer{flex:1;}
  .print-btn{
    background:var(--accent); color:var(--accent-ink);
    font-weight:800; letter-spacing:.03em;
    padding:8px 16px; border-radius:8px;
  }
  .print-btn:hover{filter:brightness(1.08); background:var(--accent);}
  .toggle{display:flex; align-items:center; gap:8px; padding:0 6px; cursor:pointer; user-select:none;}
  .toggle input{position:absolute; opacity:0; width:1px; height:1px;}
  .toggle .pill{
    width:34px; height:19px; border-radius:20px;
    background:#4a5262; position:relative; transition:background .15s; flex:none;
  }
  .toggle .pill::after{
    content:""; position:absolute; top:2px; left:2px;
    width:15px; height:15px; border-radius:50%;
    background:#fff; transition:left .15s;
  }
  .toggle input:checked + .pill{background:var(--accent);}
  .toggle input:checked + .pill::after{left:17px;}
  .toggle small{color:var(--ink-dim); font-size:12px;}

  /* ================= Layout ================= */
  .app{
    display:flex; gap:0; align-items:stretch;
    min-height:calc(100vh - 60px);
  }
  .entries-panel{
    flex:1 1 58%;
    min-width:320px;
    padding:18px 18px 90px;
  }
  .preview-panel{
    flex:0 0 380px;
    border-left:1px solid var(--panel-edge);
    background:rgba(0,0,0,.16);
    padding:14px 14px 90px;
    overflow-y:auto;
    max-height:calc(100vh - 60px);
    position:sticky; top:60px;
  }
  body.expanded .entries-panel{display:none;}
  body.expanded .preview-panel{flex:1 1 100%; border-left:none;}

  .panel-head{
    display:flex; align-items:center; gap:10px;
    margin:2px 2px 14px;
  }
  .panel-head h2{
    margin:0; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:700;
  }
  .count-chip{
    background:var(--desk-2); border:1px solid var(--panel-edge);
    border-radius:20px; padding:3px 10px; font-size:11px; color:var(--ink-dim);
  }
  .add-btn{
    background:var(--accent); color:var(--accent-ink);
    font-weight:800; border-radius:8px; padding:7px 14px;
  }
  .add-btn:hover{filter:brightness(1.08); background:var(--accent);}

  /* ================= Entry cards ================= */
  .entry{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .entry.focused{border-color:var(--accent);}
  .entry-bar{
    display:flex; align-items:center; gap:6px;
    padding:7px 10px;
    background:var(--desk-2);
    border-bottom:1px solid var(--panel-edge);
    font-size:12px; color:var(--ink-dim);
  }
  .entry-num{font-weight:800; color:var(--ink); letter-spacing:.06em;}
  .copies-wrap{display:flex; align-items:center; gap:5px; margin-left:8px;}
  .copies-wrap input{
    width:52px; background:var(--desk); color:var(--ink);
    border:1px solid var(--panel-edge); border-radius:6px;
    padding:4px 6px; font:inherit; text-align:center;
  }
  .entry-bar .tools{margin-left:auto; display:flex; gap:2px;}
  .entry-bar .tools button{padding:5px 8px; font-size:13px;}
  .entry-canvas{
    /* a scale model of the real label: true inches, shrunk by --ed-zoom */
    background:#fff;
    width:var(--ed-w, 8.5in);
    height:var(--ed-h, 5.5in);
    margin:12px auto;
    position:relative;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    zoom:var(--ed-zoom, 0.64);
  }
  .entry-editor{
    /* the text box, turned by the label's own rotation (set inline) */
    position:absolute; left:50%; top:50%;
    color:#000;
    outline:none;
    font-family:Arial, Helvetica, sans-serif;
    font-size:var(--ed-font, 26pt); font-weight:bold;
    text-align:center; line-height:1.25;
    word-wrap:break-word;
  }
  .entry-editor:empty::before{
    content:"Type this label's text…";
    color:#b9bec7; font-weight:normal; font-size:60%;
  }
  .empty-state{
    border:2px dashed var(--panel-edge);
    border-radius:12px;
    padding:40px 20px;
    text-align:center; color:var(--ink-dim);
  }

  /* ================= Preview pages ================= */
  .page-wrap{transform-origin:top left; margin:0 auto;}
  .page{
    background:#fff; color:#000;
    box-shadow:var(--paper-shadow);
    position:relative; overflow:hidden;
  }
  .page + .page{margin-top:0;}
  .page-gap{height:18px;}
  /* Each label is placed with inline left/top/width/height from the stock table. */
  .plabel{position:absolute; display:flex; overflow:hidden;}
  /* holds the label's text and carries its rotation; sized to the label,
     or to the label turned on its side */
  .protate{position:absolute; left:50%; top:50%; display:flex;}
  .plabel.v-middle .pcontent{display:flex; flex-direction:column; justify-content:center;}
  .plabel.v-bottom .pcontent{display:flex; flex-direction:column; justify-content:flex-end;}
  .entry-editor.v-middle{display:flex; flex-direction:column; justify-content:center;}
  .entry-editor.v-bottom{display:flex; flex-direction:column; justify-content:flex-end;}
  .pcontent{
    flex:1; overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:bold;
    text-align:center; line-height:1.25;
    word-wrap:break-word;
  }
  .pcontent img, .entry-editor img{max-width:100%; vertical-align:middle;}
  .cut{                     /* on-screen guide showing where the label edges are */
    position:absolute; inset:0;
    border:1px dashed #c4c9d2; pointer-events:none;
  }
  .plabel.tiny .slot-num{display:none;}
  .testgrid .plabel.tiny .slot-num{display:block;}
  .testgrid .cut{border-color:#000;}
  .testgrid .tick{
    position:absolute; background:#000;
  }
  .plabel.tiny .overflow-flag{font-size:9px; padding:3px 5px;}
  .page-tag{
    position:absolute; bottom:-0px; right:6px;
    transform:translateY(120%);
    font-size:11px; color:var(--ink-dim); letter-spacing:.08em;
  }
  .slot-num{
    position:absolute; top:8px; left:10px;
    font:10px/1 -apple-system,"Segoe UI",Roboto,sans-serif;
    letter-spacing:.14em; text-transform:uppercase; color:#aab1bd;
    pointer-events:none;
  }
  .overflow-flag{
    position:absolute; top:6px; right:10px;
    background:var(--warn); color:#4a3800;
    font:11px/1 -apple-system,"Segoe UI",Roboto,sans-serif; font-weight:700;
    padding:5px 9px; border-radius:6px; display:none;
  }
  .plabel.overflowing .overflow-flag{display:block;}

  .field-label, .print-group .range-label{font-size:12px; color:var(--ink-dim); padding:0 2px 0 6px;}

  /* ================= Custom stock bar ================= */
  .custombar{
    flex:1 0 100%;
    display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center;
    background:var(--desk-2); border:1px solid var(--panel-edge);
    border-radius:var(--radius); padding:8px 10px;
  }
  .custombar[hidden]{display:none;}
  .custombar .cb-title{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); font-weight:700;
  }
  .custombar label{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-dim);}
  .custombar input{
    width:62px; background:var(--desk); color:var(--ink);
    border:1px solid var(--panel-edge); border-radius:6px;
    padding:5px 6px; font:inherit; font-size:12px; text-align:center;
  }
  .custombar .apply-btn{
    background:var(--accent); color:var(--accent-ink);
    font-weight:800; border-radius:7px; padding:6px 14px;
  }
  .custombar .apply-btn:hover{filter:brightness(1.08); background:var(--accent);}
  .cb-note{font-size:12px; color:var(--warn);}
  .custombar .cb-check{gap:6px;}
  #importText{
    flex:1 0 100%; min-height:104px; resize:vertical;
    background:var(--desk); color:var(--ink);
    border:1px solid var(--panel-edge); border-radius:8px;
    padding:8px 10px; font:inherit; font-size:13px;
  }
  .print-group input{
    width:70px; background:var(--desk); color:var(--ink);
    border:1px solid var(--panel-edge); border-radius:7px;
    padding:6px 8px; font:inherit; text-align:center;
  }
  .print-group input::placeholder{color:var(--ink-dim);}

  .page-bar{
    display:flex; align-items:center; gap:8px;
    margin:0 0 6px 2px;
    font-size:11px; color:var(--ink-dim);
    letter-spacing:.08em; text-transform:uppercase;
  }
  .page-bar button{
    padding:4px 9px; font-size:12px; text-transform:none; letter-spacing:0;
    background:var(--desk-2); border:1px solid var(--panel-edge);
  }
  .page-bar button:hover{border-color:var(--accent); color:var(--accent);}

  /* ================= Print ================= */
  /* the real @page size is written into #pageStyle for the chosen label type */
  @media print{
    body{background:#fff;}
    .topbar, .entries-panel, .panel-head, .cut, .slot-num,
    .overflow-flag, .page-tag, .page-gap, .page-bar{display:none !important;}
    .page-wrap.no-print{display:none !important;}
    .app{display:block; min-height:0;}
    .preview-panel{
      position:static; max-height:none; overflow:visible;
      flex:none; border:none; background:#fff; padding:0;
    }
    .page-wrap{transform:none !important; width:auto !important; height:auto !important; margin:0;}
    .page{
      box-shadow:none;
      overflow:hidden;
      page-break-after:always;
      break-inside:avoid;
    }
    .page:last-child{page-break-after:auto;}
    .page-wrap.last-print .page{page-break-after:auto;}
    .pcontent:empty::before{content:"";}
    /* the alignment test sheet prints exactly what the screen guides show */
    .testgrid .cut{display:block !important; border:1px solid #000;}
    .testgrid .slot-num{display:block !important; color:#000;}
  }
</style>
</head>
<body>

<header class="topbar">
 <div class="bar">
  <div class="brand">
    <b>Label Sheets</b>
    <span id="stockNote">S-5049G · two 8½ × 5½″ labels per page</span>
  </div>

  <div class="group" aria-label="Label type">
    <label class="field-label" for="stockSel">Label</label>
    <select id="stockSel" title="Which label stock you are printing on"></select>
  </div>

  <div class="group" role="toolbar" aria-label="Page orientation">
    <button id="portraitBtn" title="Print the sheet the tall way">▯ Portrait</button>
    <button id="landscapeBtn" title="Turn the sheet sideways — feed it into the printer rotated, and the text runs along the label's other edge">▭ Landscape</button>
  </div>

  <div class="group" aria-label="First label">
    <label class="field-label" for="startSlot">Start at</label>
    <input type="number" id="startSlot" min="1" value="1" title="Skip labels already peeled off a part-used sheet — printing starts at this position on the first sheet">
    <span class="field-label" id="startNote">of 2</span>
  </div>

  <div class="group" aria-label="Sheet tools">
    <button id="nudgeBtn" title="Shift everything a hair to line up with your printer">⇔ Align</button>
    <button id="importBtn" title="Make labels in bulk from a pasted list or a CSV file">📋 Import</button>
    <button id="newBtn" title="Clear everything and start a fresh sheet">🗑 New</button>
  </div>

  <div class="spacer"></div>
  <div class="group print-group" aria-label="Print">
    <label class="range-label" for="printRange">Pages</label>
    <input type="text" id="printRange" placeholder="All" title="Which sheets to print or export. Examples:  All  ·  2  ·  1,3  ·  2-4">
    <button id="pdfBtn" title="Save the selected sheets as a PDF file">⬇ PDF</button>
    <button class="print-btn" id="printBtn">🖨 Print</button>
  </div>
 </div>

 <div class="bar">
  <div class="group" role="toolbar" aria-label="Text style">
    <button class="b" data-cmd="bold" title="Bold (Ctrl+B)">B</button>
    <button class="i" data-cmd="italic" title="Italic (Ctrl+I)">I</button>
    <button class="u" data-cmd="underline" title="Underline (Ctrl+U)">U</button>
  </div>

  <div class="group" aria-label="Font">
    <select id="fontFamily" title="Font — applies to highlighted text, or the whole label if nothing is highlighted">
      <option value="Arial, Helvetica, sans-serif" selected>Arial</option>
      <option value="'Times New Roman', Times, serif">Times New Roman</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Impact, 'Arial Black', sans-serif">Impact</option>
    </select>
    <select id="fontSize" title="Font size (pt) — applies to highlighted text, or the whole label if nothing is highlighted">
      <option>8</option><option>9</option><option>10</option><option>11</option>
      <option>12</option><option>14</option><option>16</option><option>18</option><option>20</option>
      <option>22</option><option>24</option><option selected>26</option><option>28</option>
      <option>32</option><option>36</option><option>40</option><option>48</option>
      <option>56</option><option>64</option><option>72</option>
    </select>
  </div>

  <div class="group" role="toolbar" aria-label="Alignment">
    <button data-cmd="justifyLeft" title="Align left">⯇</button>
    <button data-cmd="justifyCenter" title="Align center">≡</button>
    <button data-cmd="justifyRight" title="Align right">⯈</button>
    <button class="valign" data-valign="top"    title="Text sits at the top of the label">⤒</button>
    <button class="valign" data-valign="middle" title="Text sits in the middle of the label">⇕</button>
    <button class="valign" data-valign="bottom" title="Text sits at the bottom of the label">⤓</button>
    <button id="rotTextBtn" title="Turn this label's text a quarter turn — click again for 180° and 270°">⟳ Text 0°</button>
  </div>

  <div class="group" aria-label="Insert">
    <button id="barcodeBtn" title="Put a Code 128 barcode on this label">▊ Barcode</button>
    <button id="qrBtn" title="Put a QR code on this label">▦ QR</button>
    <button id="imageBtn" title="Put a logo or picture on this label">🖼 Image</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
  </div>

  <div class="group" aria-label="Ready-made text">
    <select id="presetSel" title="Drop a ready-made block of text into this label">
      <option value="">Insert…</option>
    </select>
    <button id="saveBlockBtn" title="Keep this label's text as a reusable block">＋ Block</button>
    <button id="delBlockBtn" title="Delete the saved block chosen above">✕</button>
  </div>

  <div class="group" aria-label="Save and load">
    <button id="undoBtn" title="Bring back the label you just deleted" disabled>↩ Undo</button>
    <button id="saveBtn" title="Download all labels as a file you can re-open later">💾 Save</button>
    <button id="openBtn" title="Upload a previously saved label file">📂 Open</button>
    <input type="file" id="openInput" accept=".json,application/json" style="display:none">
  </div>

  <label class="toggle" title="Automatically shrink text so it never runs past the label edge">
    <input type="checkbox" id="fitToggle" checked>
    <span class="pill" aria-hidden="true"></span>
    <small>Shrink to fit</small>
  </label>
 </div>

  <div class="custombar" id="customBar" hidden>
    <span class="cb-title">Custom size (inches)</span>
    <label>Page W <input id="cPageW" type="number" step="0.01" min="1"  value="8.5"></label>
    <label>Page H <input id="cPageH" type="number" step="0.01" min="1"  value="11"></label>
    <label>Across <input id="cCols"  type="number" step="1"    min="1"  value="2"></label>
    <label>Down <input id="cRows"    type="number" step="1"    min="1"  value="5"></label>
    <label>Label W <input id="cLabW" type="number" step="0.01" min="0.5" value="4"></label>
    <label>Label H <input id="cLabH" type="number" step="0.01" min="0.5" value="2"></label>
    <label>Left margin <input id="cMargL" type="number" step="0.01" min="0" value="0.156"></label>
    <label>Top margin <input id="cMargT"  type="number" step="0.01" min="0" value="0.5"></label>
    <label>Gap across <input id="cGapX"   type="number" step="0.01" min="0" value="0.188"></label>
    <label>Gap down <input id="cGapY"     type="number" step="0.01" min="0" value="0"></label>
    <label>Text inset <input id="cPad"    type="number" step="0.01" min="0" value="0.15"></label>
    <label>Font pt <input id="cFont"      type="number" step="1"    min="6" max="200" value="14"></label>
    <button class="apply-btn" id="applyCustom">Apply</button>
    <span class="cb-note" id="customNote"></span>
  </div>

  <div class="custombar" id="importBar" hidden>
    <span class="cb-title">Make labels from a list</span>
    <select id="importMode" title="How the pasted text is split into labels">
      <option value="line">Each line is one label</option>
      <option value="blank">Blank line between labels</option>
      <option value="csv">CSV / TSV row is one label</option>
    </select>
    <label class="cb-check"><input type="checkbox" id="importHead"> First row is headings</label>
    <label class="cb-check"><input type="checkbox" id="importReplace"> Replace the labels I have</label>
    <button id="importFileBtn">📄 Choose a file…</button>
    <input type="file" id="importFile" accept=".csv,.tsv,.txt,text/csv,text/plain" style="display:none">
    <button class="apply-btn" id="doImport">Create labels</button>
    <span class="cb-note" id="importNote"></span>
    <textarea id="importText" placeholder="Paste your addresses here — one per line, or a whole spreadsheet column."></textarea>
  </div>

  <div class="custombar" id="nudgeBar" hidden>
    <span class="cb-title">Printer alignment (inches)</span>
    <label>Shift right <input id="nudgeX" type="number" step="0.01" value="0"></label>
    <label>Shift down <input id="nudgeY" type="number" step="0.01" value="0"></label>
    <button id="testGridBtn" title="Print an outline of every label so you can hold it against a real sheet">🖨 Print test grid</button>
    <button id="resetNudge">Reset</button>
    <span class="cb-note" id="nudgeNote">Remembered per label type. Negative numbers shift the other way.</span>
  </div>
</header>

<main class="app">
  <section class="entries-panel">
    <div class="panel-head">
      <h2>Labels</h2>
      <span class="count-chip" id="entryCount">0 labels</span>
      <div class="spacer"></div>
      <button class="add-btn" id="addBtn">＋ Add label</button>
    </div>
    <div id="entriesList"></div>
  </section>

  <aside class="preview-panel" id="previewPanel">
    <div class="panel-head">
      <h2>Print preview</h2>
      <span class="count-chip" id="pageCount">0 pages</span>
      <div class="spacer"></div>
      <button id="expandBtn" title="Expand the preview to full width">⛶ Expand</button>
    </div>
    <div id="pages"></div>
  </aside>
</main>

<script>
(function(){
  "use strict";
  const entriesList = document.getElementById("entriesList");
  const pagesEl     = document.getElementById("pages");
  const previewPanel= document.getElementById("previewPanel");
  const fitToggle   = document.getElementById("fitToggle");
  const entryCount  = document.getElementById("entryCount");
  const pageCount   = document.getElementById("pageCount");
  let activeEditor  = null;
  let savedRange    = null;

  try { document.execCommand("styleWithCSS", false, true); } catch(e){}
  try { document.execCommand("defaultParagraphSeparator", false, "div"); } catch(e){}

  /* ================= Label stocks =================
     All measurements are inches, taken from the sheet makers' own templates.
       page   [width, height] of the sheet that goes through the printer
       grid   [labels across, labels down]
       size   [width, height] of one label
       margin [left, top] from the sheet edge to the first label
       gutter [space between columns, space between rows]
       pad    [top/bottom, left/right] breathing room inside a label
       font   default point size for text on this stock                        */
  const STOCKS = [

    { id:"a5164", group:"Other sheets", name:"4 × 3⅓″, 6 per sheet (Avery 5164)",
      note:"six 4 × 3⅓″ shipping labels per page",
      page:[8.5,11], grid:[2,3], size:[4,3.3333],
      margin:[0.15625,0.5], gutter:[0.1875,0], pad:[0.22,0.22], font:18 },

    { id:"a5162", group:"Other sheets", name:"4 × 1⅓″, 14 per sheet (Avery 5162)",
      note:"fourteen 4 × 1⅓″ address labels per page",

      margin:[0.15625,0.8335], gutter:[0.1875,0], pad:[0.1,0.18], font:12 },

    { id:"a5161", group:"Other sheets", name:"4 × 1″, 20 per sheet (Avery 5161)",
      note:"twenty 4 × 1″ address labels per page",
      page:[8.5,11], grid:[2,10], size:[4,1],
      margin:[0.15625,0.5], gutter:[0.1875,0], pad:[0.08,0.16], font:11 },

    /* ---- one label per page, for roll / thermal printers ---- */
    { id:"t4x6", group:"Thermal rolls", name:"4 × 6″ thermal — 1 per page",
      note:"4 × 6″ thermal label · one per page",
      page:[4,6], grid:[1,1], size:[4,6],
      margin:[0,0], gutter:[0,0], pad:[0.25,0.25], font:24 },

    { id:"t4x2", group:"Thermal rolls", name:"4 × 2″ thermal — 1 per page",
      note:"4 × 2″ thermal label · one per page",
      page:[4,2], grid:[1,1], size:[4,2],
      margin:[0,0], gutter:[0,0], pad:[0.15,0.2], font:16 },

    { id:"custom", group:"Custom", name:"Custom size…",
      note:"custom label size",
      page:[8.5,11], grid:[2,5], size:[4,2],
      margin:[0.15625,0.5], gutter:[0.1875,0], pad:[0.15,0.15], font:14 }
  ];

  const stockSel  = document.getElementById("stockSel");
  const portraitBtn = document.getElementById("portraitBtn");
  const landscapeBtn= document.getElementById("landscapeBtn");
  const stockNote = document.getElementById("stockNote");
  const customBar = document.getElementById("customBar");
  const customNote= document.getElementById("customNote");
  const pageStyle = document.getElementById("pageStyle");
  const STOCK_KEY  = "shiplabel.stock";
  const ORIENT_KEY = "shiplabel.orientation";

  (function buildStockList(){
    let group = null;
    STOCKS.forEach(st => {
      if (!group || group.label !== st.group){
        group = document.createElement("optgroup");
        group.label = st.group;
        stockSel.appendChild(group);
      }
      const opt = document.createElement("option");
      opt.value = st.id;
      opt.textContent = st.name;
      group.appendChild(opt);
    });
  })();

  let stock = STOCKS[0];          // the stock as the maker describes it
  let sheet = STOCKS[0];          // the same stock as it sits on the printer
  let orientation = "portrait";
  function findStock(id){ return STOCKS.find(st => st.id === id) || null; }
  function perPage(){ return sheet.grid[0] * sheet.grid[1]; }

  /* Turning the sheet sideways doesn't move the die-cut, so the whole grid
     rotates with the paper. The text stays upright on the rotated page, which
     is what lands it along the label's other edge. */
  const r4 = n => Math.round(n * 10000) / 10000;
  function orient(st, dir){
    if (dir !== "landscape") return st;
    const W = st.page[0],  H = st.page[1];
    const C = st.grid[0],  R = st.grid[1];
    const sw = st.size[0], sh = st.size[1];
    const gx = st.gutter[0], gy = st.gutter[1];
    return Object.assign({}, st, {
      page:   [H, W],
      grid:   [R, C],
      size:   [sh, sw],
      /* what was the bottom margin becomes the left one */
      margin: [Math.max(0, r4(H - st.margin[1] - (R-1)*(sh+gy) - sh)), st.margin[0]],
      gutter: [gy, gx],
      pad:    [st.pad[1], st.pad[0]]
    });
  }

  function setOrientation(dir){
    orientation = dir === "landscape" ? "landscape" : "portrait";
    try { localStorage.setItem(ORIENT_KEY, orientation); } catch(e){}
    applyStock(stock.id);
  }
  document.getElementById("portraitBtn")
    .addEventListener("click", () => setOrientation("portrait"));
  document.getElementById("landscapeBtn")
    .addEventListener("click", () => setOrientation("landscape"));

  function applyStock(id, opts){
    const found = findStock(id);
    if (!found) return;
    stock = found;
    sheet = orient(stock, orientation);
    const sideways = orientation === "landscape";
    stockSel.value = stock.id;
    stockNote.textContent = stock.note + (sideways ? " · turned sideways" : "");
    customBar.hidden = stock.id !== "custom";
    portraitBtn.classList.toggle("is-on", !sideways);
    landscapeBtn.classList.toggle("is-on", sideways);

    /* the sheet the browser prints on, and the size new text starts at */
    pageStyle.textContent =
      "@page{ size:" + sheet.page[0] + "in " + sheet.page[1] + "in; margin:0; }";
    /* shrink the card just enough to fit a 5.4 × 4.4in slot; small labels
       are shown at their real size */
    const zoom = Math.min(1, 5.4 / sheet.size[0], 4.4 / sheet.size[1]);
    const root = document.documentElement.style;
    root.setProperty("--ed-font",  sheet.font + "pt");
    root.setProperty("--ed-w",     sheet.size[0] + "in");
    root.setProperty("--ed-h",     sheet.size[1] + "in");
    root.setProperty("--ed-pad-y", sheet.pad[0] + "in");
    root.setProperty("--ed-pad-x", sheet.pad[1] + "in");
    root.setProperty("--ed-zoom",  zoom.toFixed(3));
    sizeSel.value = String(sheet.font);

    try {
      localStorage.setItem(STOCK_KEY, stock.id);
      localStorage.setItem(ORIENT_KEY, orientation);
    } catch(e){}
    loadNudge();
    if (!opts || !opts.silent) render();
  }

  stockSel.addEventListener("change", () => applyStock(stockSel.value));

  /* ---------- start on a part-used sheet ---------- */
  const startSlotInput = document.getElementById("startSlot");
  const startNote      = document.getElementById("startNote");
  function startSkip(){
    const n = parseInt(startSlotInput.value, 10);
    return n >= 2 ? Math.min(n, perPage()) - 1 : 0;
  }
  startSlotInput.addEventListener("input", queueRender);

  /* ---------- printer alignment ---------- */
  const nudgeBar  = document.getElementById("nudgeBar");
  const nudgeBtn  = document.getElementById("nudgeBtn");
  const nudgeXIn  = document.getElementById("nudgeX");
  const nudgeYIn  = document.getElementById("nudgeY");
  const NUDGE_KEY = "shiplabel.nudge.";
  let nudge = { x:0, y:0 };
  let testGrid = false;

  /* kept per label type and per orientation, since the drift you are
     correcting depends on how the sheet goes through the printer */
  function nudgeKey(){ return NUDGE_KEY + stock.id + "." + orientation; }
  function loadNudge(){
    nudge = { x:0, y:0 };
    try {
      const raw = localStorage.getItem(nudgeKey());
      if (raw){ const v = JSON.parse(raw); nudge = { x:(+v.x || 0), y:(+v.y || 0) }; }
    } catch(e){}
    nudgeXIn.value = nudge.x;
    nudgeYIn.value = nudge.y;
  }
  function saveNudge(){
    nudge = { x:(parseFloat(nudgeXIn.value) || 0), y:(parseFloat(nudgeYIn.value) || 0) };
    try { localStorage.setItem(nudgeKey(), JSON.stringify(nudge)); } catch(e){}
    queueRender();
  }
  nudgeXIn.addEventListener("input", saveNudge);
  nudgeYIn.addEventListener("input", saveNudge);
  document.getElementById("resetNudge").addEventListener("click", () => {
    nudgeXIn.value = 0; nudgeYIn.value = 0; saveNudge();
  });
  nudgeBtn.addEventListener("click", () => {
    nudgeBar.hidden = !nudgeBar.hidden;
    nudgeBtn.classList.toggle("is-on", !nudgeBar.hidden);
  });
  document.getElementById("testGridBtn").addEventListener("click", () => {
    testGrid = true;
    render();
    setTimeout(() => printPages(new Set([1])), 150);
  });
  window.addEventListener("afterprint", () => {
    if (testGrid){ testGrid = false; render(); }
  });

  /* ---------- keep the work if the tab closes ---------- */
  const AUTOSAVE_KEY = "shiplabel.autosave";
  let autosaveOff = false;
  function autosave(){
    if (autosaveOff) return;
    try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(sheetData())); }
    catch(e){ autosaveOff = true; }      // storage full: carry on without it
  }
  function restoreAutosave(){
    let data = null;
    try {
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch(e){ return false; }
    if (!data || !Array.isArray(data.entries)) return false;
    if (!data.entries.some(e => (e.html || "").trim())) return false;
    try { loadSheet(data); return true; } catch(e){ return false; }
  }
  document.getElementById("newBtn").addEventListener("click", () => {
    const used = allEntries().some(e => e.querySelector(".entry-editor").innerText.trim());
    if (used && !confirm("Clear all labels and start a new sheet?")) return;
    entriesList.innerHTML = "";
    activeEditor = null;
    entriesList.appendChild(makeEntry());
    startSlotInput.value = 1;
    try { localStorage.removeItem(AUTOSAVE_KEY); } catch(e){}
    render();
  });

  /* ---------- custom size ---------- */
  const cIn = id => document.getElementById(id);
  function customFields(){
    return { pageW:cIn("cPageW"), pageH:cIn("cPageH"), cols:cIn("cCols"), rows:cIn("cRows"),
             labW:cIn("cLabW"), labH:cIn("cLabH"), margL:cIn("cMargL"), margT:cIn("cMargT"),
             gapX:cIn("cGapX"), gapY:cIn("cGapY"), pad:cIn("cPad"), font:cIn("cFont") };
  }
  function customFromFields(){
    const f = customFields(), num = el => parseFloat(el.value);
    const g = {
      page:[num(f.pageW), num(f.pageH)],
      grid:[Math.round(num(f.cols)), Math.round(num(f.rows))],
      size:[num(f.labW), num(f.labH)],
      margin:[num(f.margL), num(f.margT)],
      gutter:[num(f.gapX), num(f.gapY)],
      pad:[num(f.pad), num(f.pad)],
      font:Math.round(num(f.font))
    };
    for (const key in g){
      const v = g[key];
      if (Array.isArray(v) ? v.some(n => !isFinite(n) || n < 0) : (!isFinite(v) || v <= 0))
        return { error:"Every box needs a number." };
    }
    if (g.grid[0] < 1 || g.grid[1] < 1) return { error:"Across and down must be at least 1." };
    if (g.size[0] <= 0 || g.size[1] <= 0) return { error:"Label width and height must be more than 0." };
    const usedW = g.margin[0] + g.grid[0]*g.size[0] + (g.grid[0]-1)*g.gutter[0];
    const usedH = g.margin[1] + g.grid[1]*g.size[1] + (g.grid[1]-1)*g.gutter[1];
    if (usedW > g.page[0] + 0.01 || usedH > g.page[1] + 0.01)
      return { error:"That grid is " + usedW.toFixed(2) + " × " + usedH.toFixed(2) +
                     "″ — bigger than the page." };
    return { geom:g };
  }
  function fieldsFromCustom(g){
    const f = customFields();
    f.pageW.value = g.page[0];   f.pageH.value = g.page[1];
    f.cols.value  = g.grid[0];   f.rows.value  = g.grid[1];
    f.labW.value  = g.size[0];   f.labH.value  = g.size[1];
    f.margL.value = g.margin[0]; f.margT.value = g.margin[1];
    f.gapX.value  = g.gutter[0]; f.gapY.value  = g.gutter[1];
    f.pad.value   = g.pad[0];    f.font.value  = g.font;
  }
  function setCustom(g){
    const custom = findStock("custom");
    Object.assign(custom, g);
    custom.note = g.size[0] + " × " + g.size[1] + "″ · " +
      (g.grid[0]*g.grid[1]) + " per " + g.page[0] + " × " + g.page[1] + "″ page";
  }
  document.getElementById("applyCustom").addEventListener("click", () => {
    const res = customFromFields();
    if (res.error){ customNote.textContent = res.error; return; }
    customNote.textContent = "";
    setCustom(res.geom);
    applyStock("custom");
  });

  /* ================= Entries ================= */
  function makeEntry(data){
    data = data || {};
    const entry = document.createElement("div");
    entry.className = "entry";
    /* vCenter is what the older files called it */
    entry.dataset.valign = data.vAlign || (data.vCenter ? "middle" : "top");
    if (data.textRotate) entry.dataset.rot = String(data.textRotate);

    const bar = document.createElement("div");
    bar.className = "entry-bar";
    bar.innerHTML =
      '<span class="entry-num"></span>' +
      '<span class="copies-wrap">× <input type="number" min="1" max="99" value="' +
        (parseInt(data.copies,10) >= 1 ? Math.min(parseInt(data.copies,10),99) : 1) +
      '" title="How many copies of this label to print. Use {n} and {of} in the text to number them, e.g. BOX {n} OF {of}"> copies</span>' +
      '<span class="tools">' +
        '<button data-act="up" title="Move up">↑</button>' +
        '<button data-act="down" title="Move down">↓</button>' +
        '<button data-act="dup" title="Duplicate this label">⧉</button>' +
        '<button data-act="del" title="Delete this label">✕</button>' +
      '</span>';

    const ed = document.createElement("div");
    ed.className = "entry-editor";
    ed.contentEditable = "true";
    ed.spellcheck = false;
    ed.innerHTML = sanitizeHTML(data.html || "");
    if (data.fontSize)   ed.style.fontSize   = data.fontSize;
    if (data.fontFamily) ed.style.fontFamily = data.fontFamily;

    const canvas = document.createElement("div");
    canvas.className = "entry-canvas";
    canvas.appendChild(ed);

    entry.appendChild(bar);
    entry.appendChild(canvas);

    ed.addEventListener("focus", () => {
      activeEditor = ed;
      document.querySelectorAll(".entry").forEach(el =>
        el.classList.toggle("focused", el === entry));
      syncVBtn();
      syncRotBtn();
    });
    ed.addEventListener("input", queueRender);
    ed.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });

    bar.querySelector("input").addEventListener("input", queueRender);
    bar.addEventListener("click", e => {
      const act = e.target && e.target.dataset && e.target.dataset.act;
      if (!act) return;
      if (act === "del"){
        deleted.push({ data: entryData(entry), at: allEntries().indexOf(entry) });
        undoBtn.disabled = false;
        if (activeEditor === ed) activeEditor = null;
        entry.remove();
      }
      if (act === "dup"){
        const copy = makeEntry(entryData(entry));
        entry.after(copy);
      }
      if (act === "up"   && entry.previousElementSibling) entry.previousElementSibling.before(entry);
      if (act === "down" && entry.nextElementSibling)     entry.nextElementSibling.after(entry);
      queueRender();
    });

    styleEditor(entry);
    return entry;
  }

  /* The editable box mirrors the printed one: same inches, same inset, same
     quarter turn — so what fits on the card is what fits on the label. */
  function styleEditor(entry){
    const ed  = entry.querySelector(".entry-editor");
    const rot = parseInt(entry.dataset.rot, 10) || 0;
    const turned = rot === 90 || rot === 270;
    ed.style.width     = (turned ? sheet.size[1] : sheet.size[0]) + "in";
    ed.style.minHeight = (turned ? sheet.size[0] : sheet.size[1]) + "in";
    ed.style.padding   = turned
      ? sheet.pad[1] + "in " + sheet.pad[0] + "in"
      : sheet.pad[0] + "in " + sheet.pad[1] + "in";
    ed.style.transform = "translate(-50%, -50%) rotate(" + rot + "deg)";
    const v = entry.dataset.valign || "top";
    ed.classList.toggle("v-middle", v === "middle");
    ed.classList.toggle("v-bottom", v === "bottom");
  }

  function entryData(entry){
    const ed = entry.querySelector(".entry-editor");
    return {
      html: ed.innerHTML,
      fontSize: ed.style.fontSize || "",
      fontFamily: ed.style.fontFamily || "",
      vAlign: entry.dataset.valign || "top",
      textRotate: parseInt(entry.dataset.rot, 10) || 0,
      copies: parseInt(entry.querySelector(".copies-wrap input").value, 10) || 1
    };
  }
  function allEntries(){ return Array.from(entriesList.querySelectorAll(".entry")); }

  /* deleting is undoable, so it doesn't stop to ask */
  const deleted = [];
  const undoBtn = document.getElementById("undoBtn");
  undoBtn.addEventListener("click", () => {
    const last = deleted.pop();
    if (!last) return;
    const entry = makeEntry(last.data);
    const list = allEntries();
    if (last.at < list.length) list[last.at].before(entry);
    else entriesList.appendChild(entry);
    undoBtn.disabled = !deleted.length;
    entry.querySelector(".entry-editor").focus();
    render();
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    const entry = makeEntry();
    entriesList.appendChild(entry);
    entry.querySelector(".entry-editor").focus();
    queueRender();
  });

  /* ================= Selection memory ================= */
  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    if (sel.rangeCount){
      const r = sel.getRangeAt(0);
      const host = r.commonAncestorContainer;
      const inEditor = document.querySelector(".entry-editor") &&
        Array.from(document.querySelectorAll(".entry-editor")).some(ed => ed.contains(host));
      if (inEditor) savedRange = r.cloneRange();
    }
    refreshToolbarState();
  });
  function restoreSelection(){
    if (!activeEditor) return false;
    activeEditor.focus();
    if (savedRange && activeEditor.contains(savedRange.commonAncestorContainer)){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return !savedRange.collapsed;
    }
    return false;
  }
  function ensureActive(){
    if (activeEditor && document.contains(activeEditor)) return true;
    const first = document.querySelector(".entry-editor");
    if (first){ first.focus(); return true; }
    return false;
  }

  /* ================= Toolbar ================= */
  document.querySelectorAll("[data-cmd]").forEach(btn => {
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => {
      if (!ensureActive()) return;
      activeEditor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      refreshToolbarState();
      queueRender();
    });
  });
  function refreshToolbarState(){
    const map = { bold:".b", italic:".i", underline:".u",
                  justifyLeft:'[data-cmd="justifyLeft"]',
                  justifyCenter:'[data-cmd="justifyCenter"]',
                  justifyRight:'[data-cmd="justifyRight"]' };
    for (const cmd in map){
      const el = document.querySelector(".topbar " + map[cmd]);
      if (!el) continue;
      let on = false;
      try { on = document.queryCommandState(cmd); } catch(e){}
      el.classList.toggle("is-on", on);
    }
  }

  const sizeSel = document.getElementById("fontSize");
  sizeSel.addEventListener("change", () => {
    if (!ensureActive()) return;
    const pt = sizeSel.value + "pt";
    if (restoreSelection()){
      document.execCommand("fontSize", false, "7");
      activeEditor.querySelectorAll('font[size="7"]').forEach(f => {
        const span = document.createElement("span");
        span.style.fontSize = pt;
        span.innerHTML = f.innerHTML;
        f.replaceWith(span);
      });
    } else {
      activeEditor.style.fontSize = pt;
    }
    queueRender();
  });

  const famSel = document.getElementById("fontFamily");
  famSel.addEventListener("change", () => {
    if (!ensureActive()) return;
    if (restoreSelection()){
      document.execCommand("fontName", false, famSel.value);
    } else {
      activeEditor.style.fontFamily = famSel.value;
    }
    queueRender();
  });

  const vBtns = Array.from(document.querySelectorAll(".valign"));
  vBtns.forEach(btn => {
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => {
      if (!ensureActive()) return;
      const entry = activeEditor.closest(".entry");
      entry.dataset.valign = btn.dataset.valign;
      styleEditor(entry);
      syncVBtn();
      queueRender();
    });
  });
  function syncVBtn(){
    const entry = activeEditor && activeEditor.closest(".entry");
    const v = (entry && entry.dataset.valign) || "top";
    vBtns.forEach(b => b.classList.toggle("is-on", b.dataset.valign === v));
  }

  const rotBtn = document.getElementById("rotTextBtn");
  rotBtn.addEventListener("mousedown", e => e.preventDefault());
  rotBtn.addEventListener("click", () => {
    if (!ensureActive()) return;
    const entry = activeEditor.closest(".entry");
    const next = ((parseInt(entry.dataset.rot, 10) || 0) + 90) % 360;
    if (next) entry.dataset.rot = String(next); else delete entry.dataset.rot;
    styleEditor(entry);
    syncRotBtn();
    queueRender();
  });
  function syncRotBtn(){
    const entry = activeEditor && activeEditor.closest(".entry");
    const rot = entry ? (parseInt(entry.dataset.rot, 10) || 0) : 0;
    rotBtn.textContent = "⟳ Text " + rot + "°";
    rotBtn.classList.toggle("is-on", rot !== 0);
  }

  /* ================= Barcodes =================
     Both encoders are written out here rather than pulled from a CDN, so
     the page keeps working with no network at all. */

  /* ---------- Code 128 ---------- */
  const C128 = [
    "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
    "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
    "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
    "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
    "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
    "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
    "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
    "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
    "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
    "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
    "114131","311141","411131","211412","211214","211232","2331112"
  ];

  /* Code C packs two digits per symbol, so an all-digit value is half the
     width; anything else goes out as Code B. */
  function code128Codes(value){
    const codes = [];
    let start;
    if (/^\d+$/.test(value) && value.length % 2 === 0 && value.length >= 4){
      start = 105;
      for (let i = 0; i < value.length; i += 2) codes.push(parseInt(value.substr(i, 2), 10));
    } else {
      start = 104;
      for (let i = 0; i < value.length; i++){
        const c = value.charCodeAt(i);
        if (c < 32 || c > 126) throw new Error("A barcode can only hold plain keyboard characters.");
        codes.push(c - 32);
      }
    }
    let sum = start;
    codes.forEach((c, i) => { sum += c * (i + 1); });
    return [start].concat(codes, [sum % 103], [106]);
  }

  function code128SVG(value){
    const seq = code128Codes(value);
    let x = 0, bars = "";
    seq.forEach(code => {
      const pat = C128[code];
      for (let i = 0; i < pat.length; i++){
        const w = +pat[i];
        if (i % 2 === 0) bars += '<rect x="' + x + '" y="0" width="' + w + '" height="BARH"/>';
        x += w;
      }
    });
    const quiet = 10, W = x + quiet*2;
    const barH  = Math.round(W * 0.22);
    const capH  = Math.round(W * 0.085);
    const H     = barH + capH + 2;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '">' +
             '<rect width="' + W + '" height="' + H + '" fill="#fff"/>' +
             '<g transform="translate(' + quiet + ',0)" fill="#000">' +
               bars.replace(/BARH/g, barH) +
             '</g>' +
             '<text x="' + (W/2) + '" y="' + (H - 1) + '" fill="#000" text-anchor="middle" ' +
               'font-family="monospace" font-size="' + capH + '">' + escapeHTML(value) + '</text>' +
           '</svg>';
  }

  /* ---------- QR, byte mode, error correction level M, versions 1-10 ---------- */
  const QR_CAP    = [16,28,44,64,86,108,124,154,182,216];   // data bytes
  const QR_ECW    = [10,16,26,18,24,16,18,22,22,26];        // EC words per block
  const QR_BLOCKS = [1,1,1,2,2,4,4,4,5,5];
  const QR_ALIGN  = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];

  const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
  (function(){
    let x = 1;
    for (let i = 0; i < 255; i++){ GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
    for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
  })();
  const gfMul = (a,b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;

  function rsGenerator(n){
    let g = [1];
    for (let i = 0; i < n; i++){
      const next = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++){
        next[j]     ^= g[j];
        next[j + 1] ^= gfMul(g[j], GF_EXP[i]);
      }
      g = next;
    }
    return g;
  }
  function rsRemainder(data, ecLen){
    const gen = rsGenerator(ecLen);
    const res = data.concat(new Array(ecLen).fill(0));
    for (let i = 0; i < data.length; i++){
      const coef = res[i];
      if (!coef) continue;
      for (let j = 0; j < gen.length; j++) res[i + j] ^= gfMul(gen[j], coef);
    }
    return res.slice(data.length);
  }

  function qrMatrix(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    while (ver < 10 && bytes.length > QR_CAP[ver]) ver++;
    if (bytes.length > QR_CAP[9]) throw new Error("That's too long for a QR code — keep it under 216 characters.");
    const version = ver + 1, cap = QR_CAP[ver], ecLen = QR_ECW[ver], nBlocks = QR_BLOCKS[ver];

    /* --- bit stream --- */
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    put(4, 4);                                   // byte mode
    put(bytes.length, version < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    for (let i = 0; i < 4 && bits.length < cap * 8; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const words = [];
    for (let i = 0; i < bits.length; i += 8)
      words.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    const PADS = [0xEC, 0x11];
    while (words.length < cap) words.push(PADS[words.length % 2 ? 1 : 0]);

    /* --- split into blocks, add error correction, interleave --- */
    const shortLen = Math.floor(cap / nBlocks), longCount = cap - shortLen * nBlocks;
    const dataBlocks = [], ecBlocks = [];
    let at = 0;
    for (let i = 0; i < nBlocks; i++){
      const len = shortLen + (i >= nBlocks - longCount ? 1 : 0);
      const blk = words.slice(at, at + len); at += len;
      dataBlocks.push(blk);
      ecBlocks.push(rsRemainder(blk, ecLen));
    }
    const out = [];
    for (let i = 0; i < shortLen + 1; i++)
      dataBlocks.forEach(b => { if (i < b.length) out.push(b[i]); });
    for (let i = 0; i < ecLen; i++)
      ecBlocks.forEach(b => out.push(b[i]));

    /* --- lay out the modules --- */
    const size = version * 4 + 17;
    const m = [], reserved = [];
    for (let r = 0; r < size; r++){ m.push(new Array(size).fill(0)); reserved.push(new Array(size).fill(false)); }
    const set = (r, c, v) => { m[r][c] = v ? 1 : 0; reserved[r][c] = true; };

    function finder(r0, c0){
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++){
        const rr = r0 + r, cc = c0 + c;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        const on = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                   (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                   (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        set(rr, cc, on);
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (let i = 8; i < size - 8; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const AL = QR_ALIGN[ver], lastA = AL.length - 1;
    AL.forEach((r, ri) => AL.forEach((c, ci) => {
      /* only the three that would sit on a finder are left out; the ones that
         cross the timing line are still drawn, and agree with it */
      if ((ri === 0 && ci === 0) || (ri === 0 && ci === lastA) || (ri === lastA && ci === 0)) return;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        set(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) !== 1);
    }));
    set(size - 8, 8, 1);                                // always-dark module
    for (let i = 0; i < 9; i++){                        // reserve the format areas
      if (!reserved[8][i]) set(8, i, 0);
      if (!reserved[i][8]) set(i, 8, 0);
    }
    for (let i = 0; i < 8; i++){
      if (!reserved[8][size-1-i]) set(8, size-1-i, 0);
      if (!reserved[size-1-i][8]) set(size-1-i, 8, 0);
    }
    if (version >= 7){
      let v = version;
      for (let i = 0; i < 12; i++) v = (v << 1) ^ ((v >> 11) * 0x1F25);
      const info = (version << 12) | v;
      for (let i = 0; i < 18; i++){
        const bit = (info >> i) & 1, a = Math.floor(i / 3), bIdx = i % 3;
        set(a, size - 11 + bIdx, bit);
        set(size - 11 + bIdx, a, bit);
      }
    }

    /* --- zigzag the codewords in --- */
    let bitIdx = 0, dir = -1, row = size - 1;
    for (let col = size - 1; col > 0; col -= 2){
      if (col === 6) col--;                             // the vertical timing line
      for (;;){
        for (let i = 0; i < 2; i++){
          const c = col - i;
          if (!reserved[row][c]){
            const byte = out[bitIdx >> 3];
            m[row][c] = byte === undefined ? 0 : (byte >> (7 - (bitIdx & 7))) & 1;
            bitIdx++;
          }
        }
        row += dir;
        if (row < 0 || row >= size){ row -= dir; dir = -dir; break; }
      }
    }

    /* --- pick the mask that scores best --- */
    const MASKS = [
      (r,c) => (r + c) % 2 === 0,
      (r,c) => r % 2 === 0,
      (r,c) => c % 3 === 0,
      (r,c) => (r + c) % 3 === 0,
      (r,c) => (Math.floor(r/2) + Math.floor(c/3)) % 2 === 0,
      (r,c) => (r*c) % 2 + (r*c) % 3 === 0,
      (r,c) => ((r*c) % 2 + (r*c) % 3) % 2 === 0,
      (r,c) => ((r+c) % 2 + (r*c) % 3) % 2 === 0
    ];
    let best = null, bestScore = Infinity;
    for (let k = 0; k < 8; k++){
      const t = m.map(r => r.slice());
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
        if (!reserved[r][c] && MASKS[k](r, c)) t[r][c] ^= 1;
      // format information: level M is 0b00
      let f = (0 << 3) | k;
      let d = f;
      for (let i = 0; i < 10; i++) d = (d << 1) ^ ((d >> 9) * 0x537);
      const fmt = ((f << 10) | d) ^ 0x5412;
      for (let i = 0; i < 15; i++){
        const bit = (fmt >> i) & 1;
        if (i < 6)        t[i][8] = bit;
        else if (i === 6) t[7][8] = bit;
        else if (i === 7) t[8][8] = bit;
        else if (i === 8) t[8][7] = bit;
        else              t[8][14 - i] = bit;
        if (i < 8)        t[8][size - 1 - i] = bit;
        else              t[size - 15 + i][8] = bit;
      }
      const sc = qrPenalty(t, size);
      if (sc < bestScore){ bestScore = sc; best = t; }
    }
    return best;
  }

  function qrPenalty(m, size){
    let score = 0, dark = 0;
    const run = line => {
      let n = 1, s = 0;
      for (let i = 1; i < size; i++){
        if (line[i] === line[i-1]) n++;
        else { if (n >= 5) s += n - 2; n = 1; }
      }
      return s + (n >= 5 ? n - 2 : 0);
    };
    for (let r = 0; r < size; r++) score += run(m[r]);
    for (let c = 0; c < size; c++) score += run(m.map(row => row[c]));
    for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++)
      if (m[r][c] === m[r][c+1] && m[r][c] === m[r+1][c] && m[r][c] === m[r+1][c+1]) score += 3;
    const PAT = [1,0,1,1,1,0,1,0,0,0,0];
    const hit = (get) => {
      let s = 0;
      for (let i = 0; i + 11 <= size; i++){
        let ok = true;
        for (let j = 0; j < 11; j++) if (get(i + j) !== PAT[j]){ ok = false; break; }
        if (ok) s += 40;
      }
      return s;
    };
    for (let r = 0; r < size; r++) score += hit(i => m[r][i]);
    for (let c = 0; c < size; c++) score += hit(i => m[i][c]);
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (m[r][c]) dark++;
    score += Math.floor(Math.abs(dark * 100 / (size*size) - 50) / 5) * 10;
    return score;
  }

  function qrSVG(text){
    const m = qrMatrix(text), size = m.length, quiet = 4, W = size + quiet*2;
    let rects = "";
    for (let r = 0; r < size; r++){
      let c = 0;
      while (c < size){
        if (!m[r][c]){ c++; continue; }
        let w = 1;
        while (c + w < size && m[r][c + w]) w++;
        rects += '<rect x="' + (c + quiet) + '" y="' + (r + quiet) + '" width="' + w + '" height="1"/>';
        c += w;
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + W + '" ' +
             'shape-rendering="crispEdges">' +
             '<rect width="' + W + '" height="' + W + '" fill="#fff"/>' +
             '<g fill="#000">' + rects + '</g></svg>';
  }

  function barcodeSVG(kind, value){
    return kind === "qr" ? qrSVG(value) : code128SVG(value);
  }
  function barcodeSrc(kind, value){
    try {
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(barcodeSVG(kind, value));
    } catch(e){ return ""; }
  }

  /* ---------- putting one on a label ---------- */
  function textArea(entry){
    const rot = parseInt(entry.dataset.rot, 10) || 0;
    const turned = rot === 90 || rot === 270;
    const w = (turned ? sheet.size[1] : sheet.size[0]) - 2*(turned ? sheet.pad[0] : sheet.pad[1]);
    const h = (turned ? sheet.size[0] : sheet.size[1]) - 2*(turned ? sheet.pad[1] : sheet.pad[0]);
    return [Math.max(0.2, w), Math.max(0.2, h)];
  }
  function insertBarcode(kind){
    if (!ensureActive()) return;
    const entry = activeEditor.closest(".entry");
    const seed  = (window.getSelection() || {}).toString ? String(window.getSelection()).trim() : "";
    const value = prompt(kind === "qr" ? "What should the QR code say?" : "Barcode value (Code 128):", seed);
    if (value === null || !value.trim()) return;
    let svg;
    try { svg = barcodeSVG(kind, value); }
    catch(err){ alert(err.message || String(err)); return; }
    const area = textArea(entry);
    let style;
    if (kind === "qr"){
      const side = Math.min(area[0]*0.5, area[1]*0.8);
      style = "width:" + side.toFixed(2) + "in;height:" + side.toFixed(2) + "in";
    } else {
      const aspect = 0.31;                       // the SVG's height ÷ width
      const w = Math.min(area[0], area[1]*0.5/aspect);
      style = "width:" + w.toFixed(2) + "in";
    }
    insertAtCursor('<img data-bc="' + kind + '" data-val="' + escapeHTML(value).replace(/"/g,"&quot;") +
                   '" src="' + barcodeSrc(kind, value) + '" style="' + style + '">');
  }
  document.getElementById("barcodeBtn").addEventListener("click", () => insertBarcode("128"));
  document.getElementById("qrBtn").addEventListener("click", () => insertBarcode("qr"));

  /* ---------- a logo or picture ---------- */
  const imageInput = document.getElementById("imageInput");
  document.getElementById("imageBtn").addEventListener("click", () => {
    if (!ensureActive()) return;

    imageInput.click();

  imageInput.addEventListener("change", () => {

        const cv = document.createElement("canvas");
        cv.width  = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        const png = /png/i.test(file.type);
        const src = cv.toDataURL(png ? "image/png" : "image/jpeg", 0.85);
        const area = textArea(entry);
        const w = Math.min(area[0]*0.5, area[1]*0.6 * (cv.width/cv.height));

        insertAtCursor('<img data-img="1" src="' + src + '" style="width:' + w.toFixed(2) + 'in">');
      };
      img.onerror = () => alert("That image couldn't be read.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  /* ================= Ready-made text ================= */

  /* a small CSV reader: handles quoted fields, doubled quotes and tabs */
  function parseDelimited(text){
    const rows = [];
    let row = [], field = "", quoted = false;
    const delim = text.indexOf("\t") >= 0 && text.indexOf(",") < 0 ? "\t" : ",";
    for (let i = 0; i < text.length; i++){
      const ch = text[i];
      if (quoted){
        if (ch === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else quoted = false;
        } else field += ch;
      } else if (ch === '"'){ quoted = true; }
      else if (ch === delim){ row.push(field); field = ""; }
      else if (ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (ch !== "\r"){ field += ch; }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }

  function importedLabels(){
    const text = importText.value;
    if (!text.trim()) return [];
    const mode = importMode.value;
    let blocks;
    if (mode === "csv"){
      let rows = parseDelimited(text);
      if (document.getElementById("importHead").checked) rows = rows.slice(1);
      blocks = rows.map(r => r.map(c => c.trim()).filter(Boolean));
    } else if (mode === "blank"){
      blocks = text.split(/\n\s*\n/).map(b => b.split(/\n/).map(l => l.trim()).filter(Boolean));
    } else {
      let lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
      if (document.getElementById("importHead").checked) lines = lines.slice(1);
      blocks = lines.map(l => [l]);
    }
    return blocks.filter(b => b.length)
                 .map(b => b.map(escapeHTML).join("<br>"));
  }

  document.getElementById("doImport").addEventListener("click", () => {
    const made = importedLabels();
    if (!made.length){ importNote.textContent = "Nothing to import — paste some text first."; return; }
    const replace = document.getElementById("importReplace").checked;
    const existing = allEntries();
    const onlyBlank = existing.length === 1 &&
      !existing[0].querySelector(".entry-editor").innerText.trim();
    if (replace || onlyBlank){
      entriesList.innerHTML = "";
      activeEditor = null;
    }
    made.forEach(html => entriesList.appendChild(makeEntry({ html: html })));
    importNote.textContent = "Made " + made.length + (made.length === 1 ? " label." : " labels.");
    importText.value = "";
    render();
  });

  /* ================= Preview build ================= */
  let renderTimer = null;
  function queueRender(){
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 90);
  }

  /* {n} and {of} are filled in per copy, so one entry set to 12 copies
     prints BOX 1 OF 12 … BOX 12 OF 12. Only text is touched, never markup. */
  function numberTokens(html, n, of){
    if (!/\{(n|of)\}/i.test(html)) return html;
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    const walk = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walk.nextNode()))
      node.nodeValue = node.nodeValue.replace(/\{n\}/gi, n).replace(/\{of\}/gi, of);
    return tpl.innerHTML;
  }

  function flattenedLabels(){
    const out = [];
    allEntries().forEach((entry, idx) => {
      const d = entryData(entry);
      for (let i = 0; i < d.copies; i++){
        const copy = Object.assign({}, d, { html: numberTokens(d.html, i + 1, d.copies) });
        out.push({ d: copy, num: idx + 1 });
      }
    });
    return out;
  }

  function render(){
    const entries = allEntries();
    entries.forEach((e, i) => {
      e.querySelector(".entry-num").textContent = "LABEL " + (i+1);
      styleEditor(e);
    });
    entryCount.textContent = entries.length + (entries.length === 1 ? " label" : " labels");

    if (!entries.length){
      entriesList.parentElement.querySelector(".empty-state")?.remove();
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No labels yet — click “＋ Add label” to start.";
      entriesList.appendChild ? entriesList.after(empty) : null;
    } else {
      document.querySelector(".empty-state")?.remove();
    }

    const labels = flattenedLabels();
    const slots = perPage();
    startSlotInput.max = slots;
    startNote.textContent = "of " + slots;
    if (parseInt(startSlotInput.value, 10) > slots) startSlotInput.value = slots;
    const skip = startSkip();
    const pageTotal = Math.max(1, Math.ceil((labels.length + skip) / slots));
    pageCount.textContent = pageTotal + (pageTotal === 1 ? " page" : " pages");

    pagesEl.innerHTML = "";
    for (let p = 0; p < pageTotal; p++){
      const wrap = document.createElement("div");
      wrap.className = "page-wrap";
      wrap.dataset.page = p + 1;

      const bar = document.createElement("div");
      bar.className = "page-bar";
      bar.innerHTML = '<span>Sheet ' + (p+1) + ' of ' + pageTotal + '</span>';
      const oneBtn = document.createElement("button");
      oneBtn.textContent = "🖨 Print this sheet";
      oneBtn.addEventListener("click", () => printPages(new Set([p+1])));
      bar.appendChild(oneBtn);

      const page = document.createElement("div");
      page.className = "page" + (testGrid ? " testgrid" : "");
      page.style.width  = sheet.page[0] + "in";
      page.style.height = sheet.page[1] + "in";

      for (let s = 0; s < slots; s++){
        const item = labels[p*slots + s - skip];
        const col  = s % sheet.grid[0];
        const row  = Math.floor(s / sheet.grid[0]);
        const lab = document.createElement("div");
        lab.className = "plabel";
        lab.style.left   = (sheet.margin[0] + col*(sheet.size[0] + sheet.gutter[0]) + nudge.x) + "in";
        lab.style.top    = (sheet.margin[1] + row*(sheet.size[1] + sheet.gutter[1]) + nudge.y) + "in";
        lab.style.width  = sheet.size[0] + "in";
        lab.style.height = sheet.size[1] + "in";
        if (sheet.size[1] < 1.6) lab.classList.add("tiny");
        if (item && item.d.vAlign && item.d.vAlign !== "top")
          lab.classList.add("v-" + item.d.vAlign);
        lab.innerHTML =
          '<span class="slot-num">' +
            (testGrid ? "#" + (s+1) : item ? "Label " + item.num : "Empty") + '</span>' +
          '<span class="overflow-flag">Over the edge — shrink or trim</span>' +
          '<span class="cut"></span>';
        const rot = item ? (item.d.textRotate || 0) : 0;
        const turned = rot === 90 || rot === 270;
        const box = document.createElement("div");
        box.className = "protate";
        box.style.width     = (turned ? sheet.size[1] : sheet.size[0]) + "in";
        box.style.height    = (turned ? sheet.size[0] : sheet.size[1]) + "in";
        box.style.transform = "translate(-50%, -50%) rotate(" + rot + "deg)";

        const content = document.createElement("div");
        content.className = "pcontent";
        content.style.margin = turned
          ? sheet.pad[1] + "in " + sheet.pad[0] + "in"
          : sheet.pad[0] + "in " + sheet.pad[1] + "in";
        content.style.fontSize = sheet.font + "pt";
        if (item){
          content.innerHTML = item.d.html;
          if (item.d.fontSize)   content.style.fontSize   = item.d.fontSize;
          if (item.d.fontFamily) content.style.fontFamily = item.d.fontFamily;
        }
        box.appendChild(content);
        lab.appendChild(box);
        page.appendChild(lab);
      }

      pagesEl.appendChild(bar);
      wrap.appendChild(page);
      pagesEl.appendChild(wrap);
      const gap = document.createElement("div");
      gap.className = "page-gap";
      pagesEl.appendChild(gap);
    }
    scalePages();
    fitAll();
    autosave();
  }

  function scalePages(){
    const avail = previewPanel.clientWidth - 30;
    document.querySelectorAll(".page-wrap").forEach(wrap => {
      const page = wrap.firstElementChild;
      const s = Math.min(avail / page.offsetWidth, 1);
      wrap.style.transform = "scale(" + s + ")";
      wrap.style.width  = page.offsetWidth + "px";
      wrap.style.height = (page.offsetHeight * s) + "px";
    });
  }
  window.addEventListener("resize", scalePages);

  function fitAll(){
    document.querySelectorAll(".plabel").forEach(lab => {
      const c = lab.querySelector(".pcontent");
      c.style.zoom = "";
      const over = c.scrollHeight > c.clientHeight + 1;
      if (over && fitToggle.checked){
        let z = c.clientHeight / c.scrollHeight;
        z = Math.max(z * 0.985, 0.25);
        c.style.zoom = z.toFixed(3);
      }
      const stillOver = c.scrollHeight > c.clientHeight + 1;
      lab.classList.toggle("overflowing", stillOver && !fitToggle.checked);
    });
  }
  fitToggle.addEventListener("change", fitAll);

  /* ================= Expand preview ================= */
  const expandBtn = document.getElementById("expandBtn");
  expandBtn.addEventListener("click", () => {
    document.body.classList.toggle("expanded");
    const on = document.body.classList.contains("expanded");
    expandBtn.textContent = on ? "⛶ Collapse" : "⛶ Expand";
    expandBtn.classList.toggle("is-on", on);
    scalePages();
  });

  /* ================= Save / Open ================= */
  function sheetData(){
    const data = {
      app: "shiplabel-sheet",
      version: 3,
      savedAt: new Date().toISOString(),
      stock: stock.id,
      orientation: orientation,
      startSlot: parseInt(startSlotInput.value, 10) || 1,
      entries: allEntries().map(entryData)
    };
    if (stock.id === "custom"){
      data.customStock = {
        page:stock.page, grid:stock.grid, size:stock.size,
        margin:stock.margin, gutter:stock.gutter, pad:stock.pad, font:stock.font
      };
    }
    return data;
  }
  function suggestedName(){
    const first = allEntries()[0];
    const firstLine = first
      ? ((first.querySelector(".entry-editor").innerText || "").split("\n").find(l => l.trim()) || "blank")
      : "blank";
    const slug = firstLine.trim().slice(0,30).replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"") || "label";
    const d = new Date(), pad = n => String(n).padStart(2,"0");
    return "labels_" + slug + "_" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".json";
  }
  document.getElementById("saveBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(sheetData(), null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = suggestedName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  const openInput = document.getElementById("openInput");
  document.getElementById("openBtn").addEventListener("click", () => {
    openInput.value = "";
    openInput.click();
  });
  openInput.addEventListener("change", () => {
    const file = openInput.files && openInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        loadSheet(JSON.parse(reader.result));
      }catch(err){
        alert("That file doesn't look like a saved label file from this app.");
      }
    };
    reader.readAsText(file);
  });

  function loadSheet(data){
    const known = data.app === "shiplabel-sheet" || data.app === "s5049g-label-sheet";
    let list = null;
    if (known && Array.isArray(data.entries)) list = data.entries;
    else if (known && Array.isArray(data.labels))
      list = data.labels.filter(L => (L.html || "").trim()); // old single-sheet files
    if (!list) throw new Error("wrong format");
    entriesList.innerHTML = "";
    activeEditor = null;
    list.forEach(L => entriesList.appendChild(makeEntry(L)));
    // files without a stock came from the S-5049G-only version
    if (data.customStock && data.stock === "custom"){
      setCustom(data.customStock);
      fieldsFromCustom(data.customStock);
    }
    orientation = data.orientation === "landscape" ? "landscape" : "portrait";
    applyStock(findStock(data.stock) ? data.stock : "s5049g", { silent:true });
    startSlotInput.value = Math.max(1, parseInt(data.startSlot, 10) || 1);
    queueRender();
  }

  /* ================= Sanitize loaded HTML ================= */
  function sanitizeHTML(html){
    const allowedTags = new Set(["DIV","SPAN","BR","B","STRONG","I","EM","U","FONT","P","IMG"]);
    const tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    (function walk(node){
      Array.from(node.children).forEach(el => {
        walk(el);
        if (!allowedTags.has(el.tagName)){
          el.replaceWith(...el.childNodes);
          return;
        }
        if (el.tagName === "IMG"){ cleanImage(el); return; }
        Array.from(el.attributes).forEach(attr => {
          if (attr.name === "style"){
            const ok = ["font-size","font-family","font-weight","font-style",
                        "text-decoration","text-align","color"];
            const kept = attr.value.split(";").map(s => s.trim())
              .filter(s => ok.some(p => s.toLowerCase().startsWith(p + ":")))
              .join("; ");
            if (kept) el.setAttribute("style", kept); else el.removeAttribute("style");
          } else if (!(el.tagName === "FONT" && attr.name.toLowerCase() === "face")){
            el.removeAttribute(attr.name);
          }
        });
      });
    })(tpl.content);
    return tpl.innerHTML;
  }

  /* Barcodes are redrawn from their value, so a file can never hand us the
     picture; pasted-in pictures have to be plain raster data. */
  const IMG_DATA = /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=\s]+$/i;
  function cleanImage(el){
    const kind = el.getAttribute("data-bc");
    const val  = el.getAttribute("data-val");
    const size = (el.getAttribute("style") || "").split(";")
      .map(t => t.trim())
      .filter(t => /^(width|height)\s*:/i.test(t)).join("; ");
    const src  = el.getAttribute("src") || "";
    let keep;
    if (kind === "qr" || kind === "128"){
      keep = barcodeSrc(kind, val || "");
      if (!keep){ el.remove(); return; }
    } else if (el.getAttribute("data-img") && IMG_DATA.test(src.replace(/\s+/g,""))){
      keep = src;
    } else {
      el.remove();
      return;
    }
    Array.from(el.attributes).forEach(a => el.removeAttribute(a.name));
    if (kind){ el.setAttribute("data-bc", kind); el.setAttribute("data-val", val || ""); }
    else el.setAttribute("data-img", "1");
    el.setAttribute("src", keep);
    if (size) el.setAttribute("style", size);
  }

  /* ================= Print: all / one / selection ================= */
  const rangeInput = document.getElementById("printRange");

  function parseRange(str, total){
    str = (str || "").trim().toLowerCase();
    if (!str || str === "all") return null;            // null = all pages
    const set = new Set();
    for (const raw of str.split(",")){
      const part = raw.trim();
      if (!part) continue;
      const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m){
        let a = parseInt(m[1],10), b = parseInt(m[2],10);
        if (a > b) [a,b] = [b,a];
        for (let n = a; n <= b; n++) if (n >= 1 && n <= total) set.add(n);
      } else if (/^\d+$/.test(part)){
        const n = parseInt(part,10);
        if (n >= 1 && n <= total) set.add(n);
      } else {
        return undefined;                              // undefined = bad input
      }
    }
    return set.size ? set : undefined;
  }

  function printPages(selection){
    render();
    setTimeout(() => {
      const wraps = Array.from(document.querySelectorAll(".page-wrap"));
      let lastVisible = null;
      wraps.forEach(w => {
        const n = parseInt(w.dataset.page, 10);
        const show = !selection || selection.has(n);
        w.classList.toggle("no-print", !show);
        w.classList.remove("last-print");
        if (show) lastVisible = w;
      });
      if (lastVisible) lastVisible.classList.add("last-print");
      window.print();
    }, 120);
  }
  window.addEventListener("afterprint", () => {
    document.querySelectorAll(".page-wrap").forEach(w =>
      w.classList.remove("no-print", "last-print"));
  });

  document.getElementById("printBtn").addEventListener("click", () => {
    const total = document.querySelectorAll(".page-wrap").length || 1;
    const sel = parseRange(rangeInput.value, total);
    if (sel === undefined){
      alert('Couldn\'t read that page selection. Try things like:  All  ·  2  ·  1,3  ·  2-4');
      rangeInput.focus();
      return;
    }
    printPages(sel);
  });
  window.addEventListener("beforeprint", fitAll);

  /* ================= Export to PDF ================= */
  const pdfBtn = document.getElementById("pdfBtn");
  let libsPromise = null;
  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = res;
      s.onerror = () => rej(new Error("Couldn't load " + src));
      document.head.appendChild(s);
    });
  }
  function ensureLibs(){
    if (!libsPromise){
      libsPromise = Promise.all([
        loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
        loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
      ]).catch(err => { libsPromise = null; throw err; });
    }
    return libsPromise;
  }

  // html2canvas can't capture CSS zoom (used by shrink-to-fit),
  // so recreate the same shrink with a transform for the snapshot.
  function convertZoomForCapture(pageClone){
    pageClone.querySelectorAll(".pcontent").forEach(c => {
      const z = parseFloat(c.style.zoom);
      if (z && z < 1){
        c.style.zoom = "";
        const inner = document.createElement("div");
        while (c.firstChild) inner.appendChild(c.firstChild);
        inner.style.width = (100 / z) + "%";
        inner.style.transform = "scale(" + z + ")";
        inner.style.transformOrigin = "top left";
        c.appendChild(inner);
      }
    });
  }

  function pdfName(selection){
    let base = suggestedName().replace(/\.json$/, "");
    if (selection){
      base += "_sheets-" + Array.from(selection).sort((a,b) => a-b).join("-");
    }
    return base + ".pdf";
  }

  async function exportPDF(selection){
    render();
    await new Promise(r => setTimeout(r, 130));
    pdfBtn.disabled = true;
    const oldText = pdfBtn.textContent;
    pdfBtn.textContent = "⏳ Building…";
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;left:-12000px;top:0;background:#fff;";
    document.body.appendChild(holder);
    try{
      await ensureLibs();
      const wraps = Array.from(document.querySelectorAll(".page-wrap"))
        .filter(w => !selection || selection.has(parseInt(w.dataset.page, 10)));
      if (!wraps.length){
        alert("No sheets match that page selection.");
        return;
      }
      const jsPDF = window.jspdf.jsPDF;
      const sheetSize = [sheet.page[0], sheet.page[1]];
      const facing = sheetSize[0] > sheetSize[1] ? "landscape" : "portrait";
      const pdf = new jsPDF({ unit:"in", format:sheetSize.slice(), orientation:facing });
      for (let i = 0; i < wraps.length; i++){
        const clone = wraps[i].querySelector(".page").cloneNode(true);
        clone.style.boxShadow = "none";
        clone.querySelectorAll(".cut, .slot-num, .overflow-flag").forEach(n => n.remove());
        convertZoomForCapture(clone);
        holder.innerHTML = "";
        holder.appendChild(clone);
        const canvas = await window.html2canvas(clone, {
          scale: 2, backgroundColor: "#ffffff", logging: false
        });
        if (i > 0) pdf.addPage(sheetSize.slice(), facing);
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0,
                     sheetSize[0], sheetSize[1]);
      }
      pdf.save(pdfName(selection));
    }catch(err){
      alert("PDF export failed: " + (err && err.message ? err.message : err) +
            "\nYou can also use Print and choose “Save as PDF”.");
    }finally{
      holder.remove();
      pdfBtn.disabled = false;
      pdfBtn.textContent = oldText;
    }
  }

  pdfBtn.addEventListener("click", () => {
    const total = document.querySelectorAll(".page-wrap").length || 1;
    const sel = parseRange(rangeInput.value, total);
    if (sel === undefined){
      alert('Couldn\'t read that page selection. Try things like:  All  ·  2  ·  1,3  ·  2-4');
      rangeInput.focus();
      return;
    }
    exportPDF(sel);
  });

  /* ================= Init ================= */
  let startId = "s5049g";
  try {
    startId = localStorage.getItem(STOCK_KEY) || startId;
    orientation = localStorage.getItem(ORIENT_KEY) === "landscape" ? "landscape" : "portrait";
  } catch(e){}
  if (startId === "custom"){
    const res = customFromFields();
    if (res.geom) setCustom(res.geom); else startId = "s5049g";
  }
  applyStock(findStock(startId) ? startId : "s5049g", { silent:true });
  if (!restoreAutosave()) entriesList.appendChild(makeEntry());
  render();
  window.addEventListener("load", () => { scalePages(); fitAll(); });
})();
</script>
</body>
